[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-cc"
version = "0.1.0"
description = "Continuous telemetry-driven optimisation for Claude Code"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
meridian = "meridian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

[tool.ruff]
target-version = "py311"
line-length = 100
